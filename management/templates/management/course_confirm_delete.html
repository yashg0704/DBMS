{% extends 'management/base.html' %}

{% block title %}Delete Course{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mt-4 text-danger">Confirm Delete</h2>
    <p>Are you sure you want to delete <strong>{{ course.code }} {{ course.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
